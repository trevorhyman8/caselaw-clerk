[project]
name = "caselaw-clerk"
version = "0.1.0"
description = "Automated legal-blog drafting assistant for consumerfinanceprivacycounsel.com"
requires-python = ">=3.11,<3.15"
dependencies = [
    "httpx>=0.27,<1.0",
    "openpyxl>=3.1,<4.0",
    "eyecite>=2.6,<3.0",
    "rapidfuzz>=3.9,<4.0",
    "feedparser>=6.0,<7.0",
    "beautifulsoup4>=4.12,<5.0",
    "pdfplumber>=0.11,<1.0",
    "pydantic>=2.7,<3.0",
    "pydantic-settings>=2.3,<3.0",
    "fastapi>=0.111,<1.0",
    "uvicorn>=0.30,<1.0",
    "python-telegram-bot>=21.0,<22.0",
    "psycopg[binary]>=3.2,<4.0",
    "anthropic>=0.34,<1.0",
    "pyyaml>=6.0,<7.0",
]

[project.optional-dependencies]
dev = ["pytest>=8.0,<9.0"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["pipeline", "corpus"]
